# ค่า DATABASE_URL / DIRECT_URL อ่านจากไฟล์ .env (อยู่ใน .gitignore) ห้ามใส่รหัสผ่านลงไฟล์นี้
services:
  app:
    build:
      context: .
    ports:
      - '3000:3000'
    env_file:
      - .env

  prisma:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    command: npx prisma studio
    ports:
      - '5555:5555'
